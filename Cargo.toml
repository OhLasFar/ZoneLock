[package]
name = "zonelock"
version = "1.0.8"
edition = "2021"
description = "Window zones for Windows: snap apps into zones, and F11 fullscreen stays in its zone"
license = "GPL-3.0-or-later"
authors = ["OhLasFar"]
repository = "https://github.com/OhLasFar/ZoneLock"
homepage = "https://github.com/OhLasFar/ZoneLock"
readme = "README.md"
keywords = ["windows", "window-manager", "fancyzones", "ultrawide", "tiling"]
categories = ["gui"]

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Devices_Display",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security",
    "Win32_Networking_WinHttp",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webview2-com = "0.39.1"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lib]
name = "zonelock"
path = "src/lib.rs"

[[bin]]
name = "zonelock"
path = "src/main.rs"
