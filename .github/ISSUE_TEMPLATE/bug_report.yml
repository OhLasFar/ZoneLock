name: Bug report
description: Something does not behave as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what did you get?
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: Which app?
      description: The program involved (e.g. chrome.exe, vlc.exe), if any.
  - type: input
    id: setup
    attributes:
      label: Your setup
      description: Windows version, number of displays, their resolution and scaling.
      placeholder: Windows 11 24H2, 2 displays (3440x1440 100%, 1920x1080 125%)
  - type: input
    id: version
    attributes:
      label: ZoneLock version
      placeholder: v1.0.0
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: The last lines of %APPDATA%\ZoneLock\zonelock.log around the problem (Settings → System opens the folder).
      render: text
